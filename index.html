<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>linkdash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">

    <header>
      <img src="avatar.jpg" class="avatar" alt="Dash">
      <h1>Dash</h1>
      <p class="role">game developer</p>
    </header>

    <a href="https://www.youtube.com/@dash_lamperough" target="_blank" rel="noopener" class="card card-yt">
      <div class="yt-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="#fff" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </div>
      <span class="card-name">@dash_lamperough</span>
      <span class="arr">↗</span>
    </a>

    <section>
      <div class="section-label">// games</div>

      <!-- Chassis -->
      <div class="card card-game">
        <div class="cover-wrap">
          <img src="icons/chassis.png" class="cover-img" alt="Chassis: Mecha Fighting League">
        </div>
        <div class="game-foot">
          <span class="game-name">Chassis: Mecha Fighting League</span>
          <div class="plats">
            <a href="https://dash2026.itch.io/chassis" target="_blank" rel="noopener" class="plat">itch.io</a>
            <a href="https://play.google.com/store/apps/details?id=com.chassis.game" target="_blank" rel="noopener" class="plat">Android</a>
          </div>
        </div>
      </div>

      <!-- 77-36 -->
      <div class="card card-game">
        <div class="cover-wrap">
          <img src="icons/77-36.png" class="cover-img" alt="77-36: Scratch Your Way Out">
        </div>
        <div class="game-foot">
          <span class="game-name">77-36: Scratch Your Way Out</span>
          <div class="plats">
            <a href="https://dash2026.itch.io/77-36" target="_blank" rel="noopener" class="plat">itch.io</a>
            <a href="https://apps.microsoft.com/detail/9NMK0J8K0B3X?hl=en-us&gl=AE&ocid=pdpshare" target="_blank" rel="noopener" class="plat">Windows</a>
            <a href="https://play.google.com/store/apps/details?id=com.dashunlimited.game7736" target="_blank" rel="noopener" class="plat">Android</a>
          </div>
        </div>
      </div>

      <!-- Frostbites -->
      <div class="card card-multi">
        <img src="icons/frostbites.png" class="app-icon" alt="Frostbites">
        <span class="card-name">Frostbites — Serve and Survive</span>
        <div class="plats">
          <a href="https://apps.microsoft.com/detail/9PJX7F7WBQ5N" target="_blank" rel="noopener" class="plat">Windows</a>
          <a href="https://play.google.com/store/apps/details?id=com.frostbites.game" target="_blank" rel="noopener" class="plat">Android</a>
        </div>
      </div>

      <!-- Dash Games -->
      <a href="https://play.google.com/store/apps/details?id=top.dashgames.app" target="_blank" rel="noopener" class="card card-icon">
        <img src="icons/dashgames.png" class="app-icon" alt="Dash Games">
        <span class="card-name">Dash Games</span>
        <span class="tag">Android</span>
        <span class="arr">↗</span>
      </a>

    </section>

    <section>
      <div class="section-label">// apps</div>

      <a href="https://apps.microsoft.com/detail/XPFM31167XZ8MJ?hl=en-US&gl=AE&ocid=pdpshare" target="_blank" rel="noopener" class="card card-icon">
        <img src="icons/dashpad.jpg" class="app-icon" alt="DashPad">
        <span class="card-name">DashPad</span>
        <span class="tag">Windows</span>
        <span class="arr">↗</span>
      </a>

      <a href="https://play.google.com/store/apps/details?id=com.tagudon.app" target="_blank" rel="noopener" class="card card-icon">
        <img src="icons/tagudon.webp" class="app-icon" alt="Tagudon">
        <span class="card-name">Tagudon</span>
        <span class="tag">Android</span>
        <span class="arr">↗</span>
      </a>

    </section>

  </div>
</body>
</html>
